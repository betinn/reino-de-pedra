<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reino de Pedra — Direções visuais</title>
  <meta name="description" content="Comparação das duas direções visuais propostas para o Reino de Pedra.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500;700&family=IM+Fell+English+SC&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body { background: #26282c; background-image: none; color: #ece6da; font-family: system-ui, sans-serif; }
    .cab { max-width: 1320px; margin: 0 auto; padding: 24px 16px 8px; }
    .cab h1 { font-family: system-ui, sans-serif; text-transform: none; letter-spacing: 0; font-weight: 700; font-size: 24px; }
    .cab p { color: #b9b3a8; margin-top: 6px; max-width: 70ch; }
    .cab a { color: #9cc7ea; }
    .troca { display: none; position: sticky; top: 0; z-index: 5; padding: 8px 16px; background: #26282c; }
    .troca .abas { --cor-superficie-2: #1c1d20; --cor-superficie: #3a3d43; --cor-borda: #45484f; --cor-texto: #fff; --cor-texto-2: #b9b3a8; }
    .dirs { max-width: 1320px; margin: 0 auto; padding: 8px 16px 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .dir { background-color: var(--cor-fundo); background-image: var(--textura); color: var(--cor-texto); font-family: var(--fonte-texto); border-radius: 16px; padding: 20px 16px; display: grid; gap: 18px; align-content: start; border: 1px solid rgba(255,255,255,.08); }
    .dir > header h2 { font-size: 30px; }
    .dir > header p { color: var(--cor-texto-2); margin-top: 6px; }
    .dir h3 { font-family: var(--fonte-titulo); font-size: 15px; color: var(--cor-texto-2); margin-bottom: 8px; }
    .paleta { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
    .cor { border-radius: var(--raio-2); border: 1px solid var(--cor-borda); overflow: hidden; background: var(--cor-superficie); font-size: 12px; }
    .cor i { display: block; height: 40px; }
    .cor span { display: block; padding: 4px 6px; line-height: 1.25; }
    .cor code { color: var(--cor-texto-3); font-size: 11px; }
    .tipo .t1 { font-family: var(--fonte-titulo); font-size: 34px; text-transform: var(--titulo-caixa); letter-spacing: var(--titulo-espaco); font-weight: var(--peso-titulo); line-height: 1.1; }
    .tipo .t2 { font-size: 16px; margin-top: 6px; }
    .tipo .t3 { font-size: 14px; color: var(--cor-texto-3); margin-top: 4px; }
    .comp { display: grid; gap: 10px; }
    .comp .linha { flex-wrap: wrap; }
    .icones { display: flex; flex-wrap: wrap; gap: 10px; }
    .icones .ico { width: 30px; height: 30px; }
    .telefone { display: grid; gap: 8px; justify-items: center; }
    .telefone iframe { width: 390px; max-width: 100%; height: 780px; border: 10px solid #0b0b0c; border-radius: 34px; background: #000; box-shadow: 0 20px 40px rgba(0,0,0,.4); }
    .telefone .abas { width: 390px; max-width: 100%; }
    @media (max-width: 900px) {
      .troca { display: block; }
      .dirs { grid-template-columns: 1fr; }
      .dirs[data-ver="a"] .dir[data-direcao="b"], .dirs[data-ver="b"] .dir[data-direcao="a"] { display: none; }
      .telefone iframe { height: 720px; border-width: 6px; border-radius: 24px; }
    }
  </style>
</head>
<body>
  <header class="cab">
    <h1>Reino de Pedra · Direções visuais</h1>
    <p>Duas propostas sobre a mesma estrutura de telas. Só os tokens mudam (cores, fontes, forma, traço dos ícones e estilo do mapa). Cada telefone é o protótipo real e pode ser navegado. <a href="index.html">Abrir o protótipo</a>.</p>
  </header>
  <div class="troca"><div class="abas" role="group" aria-label="Ver direção">
    <button class="aba" type="button" data-ver="a" aria-pressed="true">A · Fortaleza</button>
    <button class="aba" type="button" data-ver="b" aria-pressed="false">B · Cartógrafo</button>
  </div></div>
  <main class="dirs" data-ver="a"></main>

  <script src="js/icones.js"></script>
  <script>
    (function () {
      var DIRS = {
        a: { nome: 'Fortaleza', conceito: 'Pedra escura entalhada, ferro e brasa. Clima noturno de fortaleza; a ação principal brilha em laranja de forja. O mapa é pintado em tons cheios e a névoa é fumaça escura.', titulo: 'Cinzel', texto: 'Barlow Semi Condensed' },
        b: { nome: 'Cartógrafo', conceito: 'Pergaminho, tinta e lacre, emoldurados por barras de ferro. O mapa parece desenhado à mão por um cartógrafo; o desconhecido é pergaminho em branco ("terra incógnita"). Ícones em traço de tinta.', titulo: 'IM Fell English SC', texto: 'Alegreya Sans' }
      };
      var CORES = [
        ['--cor-fundo', 'Fundo'], ['--cor-superficie', 'Superfície'], ['--cor-superficie-2', 'Superfície 2'], ['--cor-borda-forte', 'Borda forte'],
        ['--cor-texto', 'Texto'], ['--cor-texto-2', 'Texto 2'], ['--cor-primaria', 'Primária'], ['--cor-destaque', 'Destaque'],
        ['--cor-sucesso', 'Sucesso'], ['--cor-alerta', 'Alerta'], ['--cor-perigo', 'Perigo'], ['--cor-info', 'Info'],
        ['--cor-meu', 'Meu reino'], ['--cor-rival-1', 'Rival 1'], ['--cor-rival-2', 'Rival 2'], ['--barra-fundo', 'Barras'],
        ['--t-planicie', 'Planície'], ['--t-floresta', 'Floresta'], ['--t-colina', 'Colina'], ['--t-montanha', 'Montanha'],
        ['--t-pantano', 'Pântano'], ['--rio-agua', 'Rio'], ['--nevoa-1', 'Névoa'], ['--rota-cor', 'Rota']
      ];
      var ICONES = [['madeira', 'r-madeira'], ['pedra', 'r-pedra'], ['comida', 'r-comida'], ['ferro', 'r-ferro'], ['populacao', 'r-populacao'], ['ouro', 'r-ouro'], ['gema', 'r-gema'], ['lendario', 'r-lendario'],
        ['castelo'], ['vila'], ['mina'], ['serraria'], ['pasto'], ['armazem'], ['ferraria'], ['quartel'], ['tropas'], ['explorador'], ['bandeira'], ['estandarte'], ['escudo'], ['relogio']];
      var main = document.querySelector('.dirs');
      main.innerHTML = Object.keys(DIRS).map(function (k) {
        var d = DIRS[k];
        return '<article class="dir" data-direcao="' + k + '">' +
          '<header><h2>' + k.toUpperCase() + ' · ' + d.nome + '</h2><p>' + d.conceito + '</p></header>' +
          '<section><h3>Paleta</h3><div class="paleta" data-paleta></div></section>' +
          '<section class="tipo"><h3>Tipografia</h3><div class="t1">Reino de Pedra</div>' +
          '<div class="t2">Forças desconhecidas se aproximam do Pasto das Éguas. Chegada em 41:07 · 2.340 madeira</div>' +
          '<div class="t3">Títulos: ' + d.titulo + ' · Texto e números: ' + d.texto + '</div></section>' +
          '<section class="comp"><h3>Componentes</h3>' +
          '<div class="linha"><button class="btn btn-primario">Fundar reino</button><button class="btn">Recrutar</button><button class="btn btn-fantasma">Cancelar</button></div>' +
          '<div class="linha"><span class="selo selo-visivel">Visível agora</span><span class="selo selo-antigo">Visto há 6 h</span><span class="selo selo-desconhecido">Desconhecido</span><span class="selo selo-perigo">Sob ameaça</span><span class="selo selo-info">Apenas defender</span></div>' +
          '<div class="card"><div class="timer"><div class="timer-topo"><b>Serraria do Bosque → nível 4</b><span class="timer-resta">12:40</span></div><div class="barra"><i style="width:58%"></i></div></div></div>' +
          '<div class="abas"><button class="aba" aria-selected="true">Todos</button><button class="aba" aria-selected="false">Produção</button><button class="aba" aria-selected="false">Militar</button></div>' +
          '<div class="faixa-alerta">' + RP.icone('alerta') + '<span class="txt"><b>Forças desconhecidas</b> → Pasto das Éguas<br>chegada em <b>41:07</b></span></div>' +
          '<div class="icones">' + ICONES.map(function (i) { return RP.icone(i[0], i[1] || '', i[0]); }).join('') + '</div>' +
          '</section>' +
          '<section class="telefone"><h3>Protótipo</h3>' +
          '<div class="abas" role="group" aria-label="Tela do protótipo"><button class="aba" data-tela="inicio" aria-pressed="true">Entrada</button><button class="aba" data-tela="mapa" aria-pressed="false">Mapa</button><button class="aba" data-tela="reino" aria-pressed="false">Meu reino</button></div>' +
          '<iframe title="Protótipo, direção ' + k.toUpperCase() + '" src="index.html?dir=' + k + '#/inicio"></iframe></section>' +
          '</article>';
      }).join('');
      RP.injetarIcones();
      Array.prototype.forEach.call(document.querySelectorAll('.dir'), function (art) {
        var cs = getComputedStyle(art);
        art.querySelector('[data-paleta]').innerHTML = CORES.map(function (c) {
          var v = cs.getPropertyValue(c[0]).trim();
          return '<div class="cor"><i style="background:' + v + '"></i><span>' + c[1] + '<br><code>' + c[0] + '</code><br><code>' + v + '</code></span></div>';
        }).join('');
        art.addEventListener('click', function (e) {
          var b = e.target.closest('[data-tela]');
          if (!b) return;
          art.querySelectorAll('[data-tela]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
          art.querySelector('iframe').src = 'index.html?dir=' + art.getAttribute('data-direcao') + '#/' + b.getAttribute('data-tela');
        });
      });
      document.querySelector('.troca').addEventListener('click', function (e) {
        var b = e.target.closest('[data-ver]');
        if (!b) return;
        main.setAttribute('data-ver', b.getAttribute('data-ver'));
        document.querySelectorAll('.troca [data-ver]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      });
    })();
  </script>
</body>
</html>
